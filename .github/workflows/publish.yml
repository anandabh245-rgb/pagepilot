name: PagePilot Publisher
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Type true to really post. Default is a safe dry run."
        default: "false"
  schedule:
    - cron: "0 1,13,16,19,22 * * *"
permissions:
  contents: write
concurrency:
  group: pagepilot-publisher
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Publish posts
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.live == 'false' && 'true' || 'false' }}
          MAX_POSTS: "1"
        run: python facebook_publisher.py
      - name: Save posted log
        if: always()
        run: |
          git config user.name "PagePilot Bot"
          git config user.email "pagepilot@users.noreply.github.com"
          git add data/posted.json
          git add -A data/preview 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update posted log"
          git pull --rebase
          git push
