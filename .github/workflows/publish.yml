name: PagePilot Publisher
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Type true to really post. Default is a safe dry run."
        default: "false"
  schedule:
    - cron: "30 13,18,23 * * *"
permissions:
  contents: write
concurrency:
  group: pagepilot-publisher
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish posts
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.live == 'true' && 'false' || 'true' }}
          MAX_POSTS: "2"
        run: python facebook_publisher.py
      - name: Save posted log
        if: always()
        run: |
          git config user.name "PagePilot Bot"
          git config user.email "pagepilot@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || git commit -m "Update posted log"
          git pull --rebase
          git push
