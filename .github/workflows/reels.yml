name: PagePilot Reels
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Type true to really post a Reel. Default is a safe preview."
        default: "false"
      scheduled:
        description: "Used by the outside timer. Type true to follow the US time slots."
        default: "false"
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
concurrency:
  group: pagepilot-reels
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        timeout-minutes: 5
        run: pip install pillow requests imageio-ffmpeg
      - name: Set up ffmpeg
        timeout-minutes: 3
        run: |
          mkdir -p "$HOME/ffbin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/ffbin/ffmpeg"
          echo "$HOME/ffbin" >> "$GITHUB_PATH"
          "$HOME/ffbin/ffmpeg" -version | head -1
      - name: Make and send Reel
        timeout-minutes: 12
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (github.event.inputs.live == 'true' && 'false' || 'true') }}
          ENFORCE_GAP: ${{ (github.event_name == 'schedule' || github.event.inputs.scheduled == 'true') && 'true' || 'false' }}
        run: python reel_publisher.py
      - name: Save logs
        if: always()
        run: |
          git config user.name "PagePilot Bot"
          git config user.email "pagepilot@users.noreply.github.com"
          git add data/reels_posted.json 2>/dev/null || true
          git add data/reel_preview.mp4 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update Reel log"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 10; done
