name: Feed Test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python feed_test.py
      - run: |
          git config user.name "PagePilot Bot"
          git config user.email "pagepilot@users.noreply.github.com"
          git add data/feed_test.json
          git commit -m "Feed test results" || exit 0
          git pull --rebase
          git push
