name: PagePilot News Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: pagepilot-news

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect news
        run: python news_agent.py

      - name: Write posts and fact-check them
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python story_agent.py

      - name: Write evergreen and Doomsday posts
        if: always()
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python evergreen_agent.py

      - name: Save results
        if: always()
        run: |
          git config user.name "PagePilot Bot"
          git config user.email "pagepilot@users.noreply.github.com"
          git add data/stories.json data/final_posts.json 2>/dev/null || true
          git add data/evergreen_posts.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update news and posts"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 10; done
