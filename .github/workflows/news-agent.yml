name: PagePilot News Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect news
        run: python news_agent.py

      - name: Write posts and fact-check them
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python story_agent.py

      - name: Save results
        run: |
          git config user.name "PagePilot Bot"
          git config user.email "pagepilot@users.noreply.github.com"
          git add data/stories.json data/final_posts.json
          git diff --cached --quiet || git commit -m "Update news and posts"
          git pull --rebase
          git push
