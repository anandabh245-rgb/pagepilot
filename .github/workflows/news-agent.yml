name: PagePilot News Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  collect-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PagePilot
        run: python news_agent.py

      - name: Save results
        run: |
          git config user.name "PagePilot Bot"
          git config user.email "pagepilot@users.noreply.github.com"

          git add data/stories.json

          git diff --cached --quiet || git commit -m "Update daily news"

          git push
