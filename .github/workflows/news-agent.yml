name: PagePilot News Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  collect-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect news
        run: python news_agent.py

      - name: Generate Facebook drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python content_agent.py

      - name: Install URL decoder
        run: pip install googlenewsdecoder

      - name: Test original article URLs
        run: python resolve_urls.py

      - name: Create final posts
        run: python finalize_posts.py

      - name: Save results
        run: |
          git config user.name "PagePilot Bot"
          git config user.email "pagepilot@users.noreply.github.com"

          git add data/stories.json data/drafts.json data/resolved_urls.json data/final_posts.json

          git diff --cached --quiet || git commit -m "Update news, drafts and resolved URLs"

          git push
